# Extensible extraction schema — add fields without code changes.
fields:
  - id: loan_agreement_id
    label: Loan / Agreement ID
    category: Identification
    answer_style: text
    retrieval_queries:
      - agreement number facility identifier loan id reference number
      - agreement id note number facility id
    aliases:
      - agreement id
      - facility id
      - reference number
    evidence_hints:
      - Agreement No.
      - Facility ID
      - Reference Number
    prompt_instructions: >
      Return the agreement or facility identifier only when an explicit document id,
      number, or reference is stated. If no formal identifier appears in the evidence,
      mark the field absent.

  - id: agreement_date_effective_date
    label: Agreement Date & Effective Date
    category: Identification
    answer_style: date
    retrieval_queries:
      - date of this agreement effective date dated as of closing date
      - agreement dated as of effective date
    aliases:
      - agreement date
      - effective date
      - dated as of
      - closing date
    evidence_hints:
      - dated as of
      - effective date means
      - date hereof
    prompt_instructions: >
      Return the agreement date and effective date together when both are explicit. If
      only one date is stated, return the stated date and identify it concisely.

  - id: borrower_name
    label: Borrower Name & Legal Entity Type
    category: Identification
    answer_style: entity
    post_processor: borrower_name
    retrieval_limit: 5
    retrieval_queries:
      - borrower name loan agreement party
      - exact legal name of borrower obligor company
      - preamble company entered into among
    aliases:
      - borrower
      - obligor
      - company
      - loan party
      - preamble
    evidence_hints:
      - entered into among
      - Company - see the Preamble
      - this amended and restated loan and security agreement
    prompt_instructions: >
      Return the exact legal entity name of the borrower and include the legal entity
      type if it is explicitly stated nearby.

  - id: borrower_jurisdiction
    label: Borrower Jurisdiction of Incorporation
    category: Identification
    answer_style: jurisdiction
    retrieval_queries:
      - borrower jurisdiction of incorporation organized under laws of
      - company is a delaware corporation jurisdiction organization
    aliases:
      - jurisdiction of incorporation
      - state of incorporation
      - organized under the laws of
      - corporation
    evidence_hints:
      - organized under the laws of
      - a Delaware corporation
      - validly existing
    prompt_instructions: >
      Return the borrower's jurisdiction of incorporation or organization only, such as
      "Delaware" or "State of Illinois".

  - id: lender_name
    label: Lender(s) Name(s)
    category: Identification
    answer_style: entity
    post_processor: lender_name
    retrieval_limit: 5
    retrieval_queries:
      - lender facility agent administrative agent
      - exact legal name of administrative agent lender
      - preamble lasalle lender agent
    aliases:
      - lender
      - lenders
      - administrative agent
      - issuing lender
      - arranger
    evidence_hints:
      - as administrative agent for the lenders
      - in its individual capacity
      - Lender - see the Preamble
    prompt_instructions: >
      Return the named lender or administrative agent legal entity. If multiple lenders
      are listed, summarize the lender group and the named agent concisely.

  - id: guarantors
    label: Guarantor(s) / Co-obligors
    category: Identification
    answer_style: summary
    retrieval_queries:
      - guarantors co-obligors guaranty parties loan parties
      - guarantors mean collectively guaranty agreement
    aliases:
      - guarantor
      - guarantors
      - co-obligor
      - guaranty
    evidence_hints:
      - Guarantors mean
      - Guaranty and Collateral Agreement
    prompt_instructions: >
      Return the guarantors or co-obligors explicitly named in the agreement. If there
      is a defined collective group, summarize the named entities or the group clearly.

  - id: obligor_country_sector
    label: Obligor Country & Sector
    category: Identification
    answer_style: summary
    retrieval_queries:
