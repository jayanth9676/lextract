    aliases:
      - country
      - sector
      - industry
      - business
    evidence_hints:
      - corporation
      - company
      - business
    prompt_instructions: >
      Return the obligor's country and operating sector only if the evidence states both
      or provides a clear business description.

  - id: facility_amount
    label: Loan Amount (Currency & Principal)
    category: Financial Terms
    answer_style: amount
    post_processor: facility_amount
    retrieval_limit: 5
    retrieval_queries:
