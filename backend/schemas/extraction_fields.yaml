      - total revolving commitment amount
      - maximum loan amount commitment
    aliases:
      - facility
      - commitment
      - revolving commitment
      - aggregate commitments
      - principal amount
    evidence_hints:
      - commitment means
      - Annex A
      - aggregate stated amount
      - revolving loan commitment
    prompt_instructions: >
      Return only the overall facility or commitment amount. Do not return per-lender
      commitments, minimum increment thresholds, fees, or letter-of-credit sublimits.

  - id: tranche_structure
