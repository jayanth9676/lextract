[project]
name = "ai-loan-analyzer"
version = "0.1.0"
description = "LexExtract — AI-powered loan agreement extraction (Docling, Qdrant, Claude)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.28.0",
    "docling>=2.0.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.5.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Windows CPU-only: resolve torch/torchvision from PyTorch CPU wheel index (no CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
